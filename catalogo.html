<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de puertas, ventanas, puertas ventana y divisiones de baño y cocina de Vidrios Cartagena.">
  <title>Catálogo | Vidrios Cartagena</title>
  <link rel="icon" type="image/png" href="assets/img/logo/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="catalogo">
  <div id="site-header"></div>

  <main>
    <section class="page-top">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow">Catálogo</span>
          <h1>Nuestros productos</h1>
          <p>Elige una categoría, entra al producto para ver sus imágenes, medidas y materiales, y cotiza por WhatsApp.</p>
        </div>
        <div class="filters" id="filtros" role="group" aria-label="Categorías"></div>
        <div class="products" id="productos"></div>
        <p class="empty" id="sin-resultados" hidden>Pronto agregaremos productos en esta categoría.</p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/main.js" type="module"></script>
</body>
</html>
